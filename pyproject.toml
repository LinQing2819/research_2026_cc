[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "memgate"
version = "0.1.0"
description = "Per-query memory gating and anytime-valid regression monitoring for self-evolving LLM agent memory"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Building the offline bundle (scripts/offline/pack_bundle.sh); uv re-resolves the lock files.
pack = ["huggingface_hub>=0.24", "uv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
